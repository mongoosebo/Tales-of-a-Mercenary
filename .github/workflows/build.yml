name: Build & deploy

# Builds the game with Godot 4.3 on every push to main:
#  - Web build -> published to GitHub Pages (play in the browser)
#  - Windows + Linux builds -> downloadable from the workflow run's "Artifacts"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import assets
        run: timeout 300 godot --headless --import || true

      - name: Smoke test (simulates 3 minutes of play)
        run: |
          timeout 300 godot --headless --fixed-fps 60 -- --autotest=180 --god 2>&1 | tee test.log
          grep -q "AUTOTEST DONE" test.log
          ! grep -q "SCRIPT ERROR" test.log

      - name: Export Web, Windows, Linux
        run: |
          mkdir -p build/web build/windows build/linux
          godot --headless --export-release "Web" build/web/index.html
          godot --headless --export-release "Windows Desktop" build/windows/TalesOfAMercenary.exe
          godot --headless --export-release "Linux" build/linux/TalesOfAMercenary.x86_64
          ls -la build/*
          test -f build/web/index.html

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TalesOfAMercenary-windows
          path: build/windows

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: TalesOfAMercenary-linux
          path: build/linux

      - name: Upload web build for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
